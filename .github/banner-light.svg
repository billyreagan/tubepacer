<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" role="img" aria-label="tubepacer">
  <title>tubepacer</title>
  <rect width="960" height="240" rx="18" fill="#ffffff"/>
  <rect x="1" y="1" width="958" height="238" rx="17" fill="none" stroke="#dbe4f3" stroke-width="2"/>
  <!-- wordmark -->
  <text x="62" y="100" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="66" font-weight="700" letter-spacing="-2" fill="#0f172a">tube<tspan fill="#1d4ed8">pacer</tspan></text>
  <!-- tagline -->
  <text x="64" y="138" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#0f172a">One link. Paced, parallel, measured. Built on yt-dlp.</text>
  <!-- pace line: ticks spread out after a bot check, then close up; the finished stretch is green -->
  <g fill="#1d4ed8"><rect x="64" y="160" width="4" height="22" rx="2"/><rect x="78" y="160" width="4" height="22" rx="2"/><rect x="92" y="160" width="4" height="22" rx="2"/><rect x="106" y="160" width="4" height="22" rx="2"/><rect x="120" y="160" width="4" height="22" rx="2"/><rect x="134" y="160" width="4" height="22" rx="2"/><rect x="148" y="160" width="4" height="22" rx="2"/><rect x="162" y="160" width="4" height="22" rx="2"/><rect x="176" y="160" width="4" height="22" rx="2"/><rect x="190" y="160" width="4" height="22" rx="2"/><rect x="204" y="160" width="4" height="22" rx="2"/><rect x="218" y="160" width="4" height="22" rx="2"/><rect x="232" y="160" width="4" height="22" rx="2"/><rect x="246" y="160" width="4" height="22" rx="2"/><rect x="260" y="160" width="4" height="22" rx="2"/><rect x="274" y="160" width="4" height="22" rx="2"/><rect x="288" y="160" width="4" height="22" rx="2"/><rect x="310" y="160" width="4" height="22" rx="2"/><rect x="340" y="160" width="4" height="22" rx="2"/><rect x="376" y="160" width="4" height="22" rx="2"/><rect x="412" y="160" width="4" height="22" rx="2"/><rect x="442" y="160" width="4" height="22" rx="2"/><rect x="464" y="160" width="4" height="22" rx="2"/><rect x="481" y="160" width="4" height="22" rx="2"/><rect x="495" y="160" width="4" height="22" rx="2"/><rect x="509" y="160" width="4" height="22" rx="2"/><rect x="523" y="160" width="4" height="22" rx="2"/><rect x="537" y="160" width="4" height="22" rx="2"/><rect x="551" y="160" width="4" height="22" rx="2"/><rect x="565" y="160" width="4" height="22" rx="2"/><rect x="579" y="160" width="4" height="22" rx="2"/><rect x="593" y="160" width="4" height="22" rx="2"/><rect x="607" y="160" width="4" height="22" rx="2"/><rect x="621" y="160" width="4" height="22" rx="2"/><rect x="635" y="160" width="4" height="22" rx="2"/><rect x="649" y="160" width="4" height="22" rx="2"/><rect x="663" y="160" width="4" height="22" rx="2"/></g>
  <path d="M282 150 l5 7 l5 -7 z" fill="#FF2EA0"/>
  <text x="297" y="155" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="13" fill="#64748b">bot check</text>
  <rect x="681" y="160" width="215" height="22" rx="3" fill="#16a34a"/>
  <!-- status line -->
  <text x="64" y="214" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="16" fill="#64748b">12 of 12 · 1080p · 3 workers · ETA 0:00 · 0 bot checks (signed in)</text>
  <!-- mark: Pulse - steady pace, a dip at a bot check, recovery, then play -->
  <g transform="translate(730 -18)"><g fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path d="M14 100 L58 100 L70 78 L84 122 L94 100 L102 100" stroke="#3b82f6"/><path d="M102 100 L114 136" stroke="#FF2EA0"/><path d="M114 136 L126 100 L132 100" stroke="#16a34a"/></g><path d="M146 74 L146 126 L186 100 Z" fill="#0f172a" stroke="#0f172a" stroke-width="8" stroke-linejoin="round"/></g>
</svg>