<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="Seconds to answer how big and how long, log scale. For 50 videos ytdl -Estimate took a mean 3.9 seconds and yt-dlp -s took 144 seconds (R6E, 6 rounds); for 12 videos ytdl -Estimate about 3.2 seconds against 37.2 seconds. ytdl -Estimate -Precise took 409 and 103 seconds (E6E, 2 rounds). yt-dlp --flat-playlist took 3.4 and 2.0 seconds but gives no sizes.">
  <title>tubepacer size and finish-time estimate speed (R6E)</title>
