<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" role="img" aria-labelledby="t d">
<title id="t">tubepacer pacing level over time (schematic)</title>
<desc id="d">Schematic, not a measurement. Signed in, tubepacer starts at L1. A bot check moves it up one level; 50 clean videos bring it back down. A 429 moves it up two levels and the run carries on; 100 clean videos bring it down one. Two bot checks within 10 minutes open the breaker: every run on the PC stops for 1 hour. After it, one video is checked and the run resumes at the held level. A fixed 5 s sleep stays at one level throughout.</desc>
<rect width="640" height="290" rx="10" fill="#ffffff"/>
<g font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="10" fill="#64748b">
  <g stroke="#dbe4f3" stroke-width="1">
    <line x1="60" y1="210" x2="610" y2="210"/><line x1="60" y1="174" x2="610" y2="174"/><line x1="60" y1="138" x2="610" y2="138"/>
    <line x1="60" y1="102" x2="610" y2="102"/><line x1="60" y1="66" x2="610" y2="66"/><line x1="60" y1="30" x2="610" y2="30"/>
  </g>
  <text x="8" y="213">L0 1 s</text><text x="8" y="177">L1 2 s</text><text x="8" y="141">L2 3 s</text>
  <text x="8" y="105">L3 5 s</text><text x="8" y="69">L4 10 s</text><text x="8" y="33">L5 20 s</text>
  <text x="60" y="228">time</text>
</g>
<rect x="425" y="24" width="105" height="190" fill="#FF2EA0" fill-opacity="0.09"/>
<text x="477.5" y="168" text-anchor="middle" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="11" fill="#FF2EA0">breaker: 1 h</text>
<text x="477.5" y="183" text-anchor="middle" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="10" fill="#64748b">no requests</text>
<text x="477.5" y="197" text-anchor="middle" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="10" fill="#64748b">exit 75</text>
<g stroke="#64748b" stroke-dasharray="2 3" stroke-width="1">
  <line x1="120" y1="24" x2="120" y2="214"/><line x1="250" y1="24" x2="250" y2="214"/><line x1="400" y1="24" x2="400" y2="214"/>
  <line x1="425" y1="24" x2="425" y2="214"/><line x1="530" y1="24" x2="530" y2="214"/>
</g>
<g font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="10" fill="#0f172a">
  <text x="120" y="18" text-anchor="middle">bot check</text><text x="250" y="18" text-anchor="middle">429: +2, no stop</text>
  <text x="412.5" y="18" text-anchor="middle">2 bot checks</text><text x="560" y="18" text-anchor="middle">probe ok</text>
</g>
<line x1="60" y1="102" x2="610" y2="102" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
<path d="M60,174 H120 V138 H200 V174 H250 V102 H360 V138 H400 V102 H425 V66" stroke="#FF2EA0" stroke-width="3" fill="none"/>
<path d="M530,66 H610" stroke="#FF2EA0" stroke-width="3" fill="none"/>
<g font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="9.5" fill="#64748b">
  <text x="160" y="132" text-anchor="middle">50 clean</text><text x="305" y="96" text-anchor="middle">100 clean</text>
  <text x="570" y="60" text-anchor="middle">held level</text>
</g>
<g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0f172a">
  <rect x="60" y="244" width="14" height="3" fill="#64748b"/><text x="80" y="249">fixed 5 s sleep</text>
  <rect x="190" y="244" width="14" height="3" fill="#FF2EA0"/><text x="210" y="249">tubepacer 1.32: steps back, eases off, stops only on repeated bot checks</text>
</g>
<text x="60" y="274" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-style="italic" fill="#64748b">Schematic, not a measurement. Levels and rules as shipped in 1.32.0, signed in.</text>
</svg>